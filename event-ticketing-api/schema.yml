components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        start_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatusEnum'
      required:
      - id
      - start_time
      - title
      - venue
    EventSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        seat:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - event
      - id
      - price
      - seat
    EventStatusEnum:
      enum:
      - SCHEDULED
      - CANCELLED
      - COMPLETED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CANCELLED` - Cancelled
        * `COMPLETED` - Completed
    PatchedEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        start_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatusEnum'
    PatchedEventSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        seat:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    PatchedReservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        event_seat:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
          default: PENDING
        reserved_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
        row_label:
          type: string
          maxLength: 10
        seat_number:
          type: integer
          maximum: 2147483647
          minimum: 0
    PatchedVenue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        address:
          type: string
        city:
          type: string
          maxLength: 100
    Reservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        event_seat:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
          default: PENDING
        reserved_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - event_seat
      - id
      - reserved_at
      - status
      - user
    ReservationStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
    Seat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
        row_label:
          type: string
          maxLength: 10
        seat_number:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - row_label
      - seat_number
      - venue
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Venue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        address:
          type: string
        city:
          type: string
          maxLength: 100
      required:
      - address
      - city
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
